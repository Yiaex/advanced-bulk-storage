plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.advancedbulkstorage'
version = '1.0.0'
base.archivesName = 'advanced_bulk_storage'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation 'maven.modrinth:ae2:7Ac6mXbf'
    implementation 'maven.modrinth:mega:RPG4EriK'
    implementation 'maven.modrinth:guideme:QeYKsstN'
    compileOnly 'maven.modrinth:jei:zKog3N6a'
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly 'maven.modrinth:jei:zKog3N6a'
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    gameTestCompileOnly 'maven.modrinth:jade:eYz2YBGT'
    runtimeOnly 'maven.modrinth:jade:eYz2YBGT'
}

neoForge {
    version = '21.1.265'
    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
            if (providers.gradleProperty('checkGuide').isPresent()) {
                systemProperty 'advanced_bulk_storage.checkGuide', 'true'
            }
            if (providers.gradleProperty('checkInterface').isPresent()) {
                systemProperty 'advanced_bulk_storage.checkInterface', 'true'
            }
        }
        server { server(); programArgument '--nogui'; gameDirectory = project.file('run-server') }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'advanced_bulk_storage'
        }
    }
    mods {
        advanced_bulk_storage {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources', ProcessResources) {
    inputs.property('modVersion', project.version)
    filesMatching('META-INF/neoforge.mods.toml') { expand(modVersion: project.version) }
}
tasks.named('jar', Jar) {
    from(files('LICENSE', 'THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
}
